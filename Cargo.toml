[package]
name = "hfs"
version = "0.1.0"
edition = "2024"
description = "Heavy / Honest File Storage — a high-performance Git LFS alternative with content-defined chunking"
authors = ["Pedro Luz <pedromsluz@gmail.com>"]
autobenches = false

[[bin]]
name = "hfs"
path = "src/main.rs"

[dependencies]
blake3 = { version = "1", features = ["rayon"] }
fastcdc = { version = "3", features = ["tokio"] }
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
memmap2 = "0.9"
rayon = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
toml = "0.8"
indicatif = "0.17"
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
sha2 = "0.10"
flate2 = "1"
rand = "0.8"
serde_json = "1"

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "dedup"
harness = false

[[bench]]
name = "e2e_harness"
harness = false
